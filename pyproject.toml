[build-system]
build-backend = "mesonpy"
# Build against the oldest supported jaxlib. XLA accepts FFI handlers compiled against an
# older FFI API version, but it rejects handlers compiled against a newer one. Bump this pin
# together with the `jax` lower bound in `dependencies`.
requires = ["meson-python>=0.16", "Cython>=3.0", "jax==0.10.0", "jaxlib==0.10.0"]

[project]
name = "entangle-jax"
version = "0.1.1"
description = "A generic JAX primitive that is opaque to XLA reordering optimizations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Nardi Lam", email = "mail@nardilam.nl" }]
# Keep the `jax` lower bound in step with the build-system pin above.
dependencies = ["jax>=0.10", "jaxtyping>=0.2"]

[project.urls]
Homepage = "https://github.com/nardi/entangle-jax"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "meson>=1.3",
    "ninja>=1.11",
    "meson-python>=0.16",
    "Cython>=3.0",
    "ty>=0.0.1a1",
]

[tool.uv]
no-build-isolation-package = ["entangle-jax"]

[tool.meson-python.args]
setup = ["--vsenv"]

[tool.cibuildwheel]
build = "{cp311-manylinux_x86_64,cp312-manylinux_x86_64,cp313-manylinux_x86_64,cp311-win_amd64,cp312-win_amd64,cp313-win_amd64,cp311-macosx_x86_64,cp312-macosx_x86_64,cp313-macosx_x86_64,cp311-macosx_arm64,cp312-macosx_arm64,cp313-macosx_arm64}"
# Test each wheel against the minimum supported jax and jaxlib first, then against the latest.
test-requires = ["pytest", "jax==0.10.0", "jaxlib==0.10.0"]
test-command = "pytest {project}/tests && python -m pip install --upgrade jax jaxlib && pytest {project}/tests"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
